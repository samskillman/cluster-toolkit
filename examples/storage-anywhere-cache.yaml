---

blueprint_name: storage-anywhere-cache

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: anywhere-cache-example
  region: us-central1
  zone: us-central1-a

deployment_groups:
- group: primary
  modules:
  # Use the community cloud-storage-bucket module to create the bucket
  - id: bucket
    source: community/modules/file-system/cloud-storage-bucket
    settings:
      local_mount: /mnt/gcs
      random_suffix: true
      force_destroy: true

  # Use the Cluster Toolkit module for storage-anywhere-cache
  - id: cache
    source: community/modules/file-system/storage-anywhere-cache
    use: [bucket]
    settings:
      bucket: $(bucket.gcs_bucket_name)
      zone: $(vars.zone)
      ttl: "3600s"
