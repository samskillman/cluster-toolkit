---

blueprint_name: storage-anywhere-cache

vars:
  project_id:  ## Set GCP Project ID Here ##
  deployment_name: anywhere-cache-example
  region: us-central1
  zone: us-central1-a
  bucket_name: my-cache-bucket

deployment_groups:
- group: primary
  modules:
  # Reference a terraform provider directly using the "terraform" kind and a registry module
  - id: bucket
    source: github.com/terraform-google-modules/terraform-google-cloud-storage//modules/simple_bucket?ref=v5.0.0
    kind: terraform
    settings:
      name: $(vars.bucket_name)
      project_id: $(vars.project_id)
      location: $(vars.region)

  # Use the Cluster Toolkit module for storage-anywhere-cache
  - id: cache
    source: community/modules/file-system/storage-anywhere-cache
    use: [bucket]
    settings:
      bucket: $(bucket.name)
      zone: $(vars.zone)
      ttl: "3600s"
